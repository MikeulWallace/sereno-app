<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sereno — Coach IA</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sereno">
<meta name="theme-color" content="#7EB8A4">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0D0E14;--bg2:#13141C;--bg3:#1A1B26;--bg4:#20212E;
  --border:rgba(255,255,255,0.06);
  --text:#C8CAD8;--text-dim:#6B6D80;--white:#EEF0F8;
  --mental:#7EB8A4;--mental2:#A89FD8;
  --motiv:#E8A44A;--motiv2:#E86A4A;
  --sport:#5B9EE8;--sport2:#4ACFE8;
  --prog:#C67DD4;--prog2:#7D6BE8;
  --danger:#C47070;
  --accent:var(--mental);--accent2:var(--mental2);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;display:flex;flex-direction:column;position:relative}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.13;transition:background 1s}
.orb1{width:500px;height:500px;background:var(--accent);top:-180px;left:-120px;animation:drift1 14s ease-in-out infinite}
.orb2{width:350px;height:350px;background:var(--accent2);bottom:-80px;right:-80px;animation:drift2 17s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-50px)}}

/* LAYOUT */
.app{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:15px;transition:background 0.8s}
.logo-text{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;color:var(--white);letter-spacing:1px}
.logo-text span{color:var(--accent);transition:color 0.5s}
.header-right{display:flex;align-items:center;gap:8px}
.module-badge{font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--accent);transition:all 0.5s}
.voice-toggle{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--text-dim);letter-spacing:1px}
.toggle-sw{width:28px;height:16px;background:var(--bg3);border-radius:8px;border:1px solid var(--border);cursor:pointer;position:relative;transition:background 0.2s}
.toggle-sw.on{background:rgba(126,184,164,0.3);border-color:var(--accent)}
.toggle-sw::after{content:'';position:absolute;width:10px;height:10px;background:var(--text-dim);border-radius:50%;top:2px;left:2px;transition:all 0.2s}
.toggle-sw.on::after{left:14px;background:var(--accent)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);animation:pulse-dot 2s ease-in-out infinite;transition:background 0.5s,box-shadow 0.5s}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.3}}

/* VIEWS */
.view{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.view.active{display:flex}

/* CHAT */
.chips-bar{display:flex;gap:6px;padding:8px 0 6px;overflow-x:auto;flex-shrink:0}
.chips-bar::-webkit-scrollbar{display:none}
.chip{font-size:10px;padding:5px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--text-dim);cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(126,184,164,0.06)}
.messages{flex:1;overflow-y:auto;padding:12px 0 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;min-height:0}
.messages::-webkit-scrollbar{width:2px}
.messages::-webkit-scrollbar-thumb{background:var(--border)}
.msg{display:flex;gap:10px;animation:msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.msg.user{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.msg.user .msg-av{background:var(--bg3);border:1px solid var(--border);font-size:10px;color:var(--text-dim)}
.msg-body{max-width:82%}
.bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.75}
.msg.coach .bubble{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-top-left-radius:3px;font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:300}
.msg.user .bubble{background:rgba(126,184,164,0.1);border:1px solid rgba(126,184,164,0.18);color:var(--white);border-top-right-radius:3px;text-align:right}
.msg-meta{display:flex;align-items:center;gap:7px;margin-top:3px}
.msg.user .msg-meta{flex-direction:row-reverse}
.msg-time{font-size:9px;color:var(--text-dim);letter-spacing:1px}
.speak-btn{font-size:10px;padding:2px 7px;border-radius:4px;background:none;border:none;cursor:pointer;color:var(--text-dim);transition:all 0.2s}
.speak-btn:hover{color:var(--accent)}
.typing-indicator{display:none;gap:10px;align-items:center}
.typing-indicator.show{display:flex}
.typing-dots{display:flex;gap:4px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;border-top-left-radius:3px}
.typing-dots span{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bounce 1.2s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:0.15s}
.typing-dots span:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px);opacity:0.4}}
.input-area{flex-shrink:0;padding:8px 0 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.visualizer{display:flex;align-items:center;justify-content:center;gap:3px;height:24px;opacity:0;transition:opacity 0.3s}
.visualizer.active{opacity:1}
.vbar{width:3px;background:var(--accent);border-radius:2px;min-height:3px;transition:height 0.1s}
.input-row{display:flex;align-items:flex-end;gap:8px}
.mic-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all 0.3s;flex-shrink:0;color:var(--accent);position:relative}
.mic-btn::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(126,184,164,0.15);transition:all 0.3s}
.mic-btn:hover{background:rgba(126,184,164,0.08)}
.mic-btn.recording{border-color:var(--danger);color:var(--danger);animation:pulse-mic 1s ease-in-out infinite}
.mic-btn.recording::before{animation:ring 1s ease-in-out infinite}
.mic-btn.speaking{border-color:var(--accent2);color:var(--accent2)}
@keyframes pulse-mic{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{inset:-5px;opacity:0.5}100%{inset:-16px;opacity:0}}
.text-wrap{flex:1;display:flex;gap:6px;align-items:flex-end}
textarea{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--white);font-family:'DM Mono',monospace;font-size:13px;resize:none;min-height:44px;max-height:88px;transition:border-color 0.2s;line-height:1.5}
textarea:focus{outline:none;border-color:rgba(126,184,164,0.35)}
textarea::placeholder{color:var(--text-dim)}
.send-btn{width:44px;height:44px;background:var(--accent);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all 0.2s;flex-shrink:0;color:var(--bg)}
.send-btn:hover{transform:scale(1.08)}
.mic-status{font-size:9px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;text-align:center}
.mic-status.listening{color:var(--danger)}
.mic-status.speaking{color:var(--accent2)}
.mic-status.thinking{color:var(--motiv)}

/* ══ PROGRAMME VIEW ══ */
.prog-scroll{flex:1;overflow-y:auto;padding:14px 0 10px;min-height:0}
.prog-scroll::-webkit-scrollbar{width:2px}
.prog-scroll::-webkit-scrollbar-thumb{background:var(--border)}

/* Setup wizard */
.wizard{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.wizard-title{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--white);line-height:1.3}
.wizard-sub{font-size:11px;color:var(--text-dim);line-height:1.8}
.wiz-label{font-size:10px;letter-spacing:2px;color:var(--prog);text-transform:uppercase;margin-bottom:6px}
.wiz-options{display:flex;flex-wrap:wrap;gap:8px}
.wiz-opt{padding:8px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:all 0.2s}
.wiz-opt:hover,.wiz-opt.sel{border-color:var(--prog);color:var(--prog);background:rgba(198,125,212,0.08)}
.wiz-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--white);font-family:'DM Mono',monospace;font-size:13px;resize:none;min-height:70px;transition:border-color 0.2s}
.wiz-input:focus{outline:none;border-color:rgba(198,125,212,0.35)}
.wiz-input::placeholder{color:var(--text-dim)}
.wiz-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--prog),var(--prog2));border:none;border-radius:12px;color:#fff;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-transform:uppercase}
.wiz-btn:hover{opacity:0.9;transform:translateY(-1px)}
.wiz-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* Programme actif */
.prog-header-card{background:linear-gradient(135deg,rgba(198,125,212,0.15),rgba(125,107,232,0.1));border:1px solid rgba(198,125,212,0.2);border-radius:14px;padding:16px;margin-bottom:14px}
.prog-name{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--white);margin-bottom:6px}
.prog-meta{font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-bottom:12px}
.prog-bar-track{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--prog),var(--prog2));border-radius:3px;transition:width 0.8s ease}
.prog-pct{font-size:9px;color:var(--prog);letter-spacing:2px;text-align:right}
.prog-actions{display:flex;gap:8px;margin-top:10px}
.prog-action-btn{flex:1;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:10px;color:var(--text-dim);cursor:pointer;transition:all 0.2s;letter-spacing:1px;text-align:center}
.prog-action-btn:hover{border-color:var(--prog);color:var(--prog)}
.prog-action-btn.primary{background:rgba(198,125,212,0.15);border-color:rgba(198,125,212,0.3);color:var(--prog)}

/* Day cards */
.day-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;transition:border-color 0.2s;cursor:pointer}
.day-card.today{border-color:rgba(198,125,212,0.4);background:rgba(198,125,212,0.05)}
.day-card.done{opacity:0.6}
.day-card.locked{opacity:0.35;cursor:default}
.day-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.day-num{font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
.day-badge{font-size:9px;padding:2px 8px;border-radius:10px;letter-spacing:1px}
.day-badge.today{background:rgba(198,125,212,0.2);color:var(--prog)}
.day-badge.done{background:rgba(61,220,151,0.15);color:#3DDC97}
.day-badge.locked{background:var(--bg3);color:var(--text-dim)}
.day-title{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--white);margin-bottom:4px}
.day-desc{font-size:11px;color:var(--text-dim);line-height:1.7}
.day-exercises{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.exo-tag{font-size:9px;padding:3px 8px;background:var(--bg3);border-radius:8px;color:var(--text-dim)}

/* Day detail modal */
.day-modal{display:none;position:fixed;inset:0;z-index:150;background:rgba(13,14,20,0.95);flex-direction:column;padding:20px 16px;overflow-y:auto}
.day-modal.show{display:flex}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-shrink:0}
.modal-back{background:none;border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:10px;letter-spacing:2px;transition:all 0.2s}
.modal-back:hover{border-color:var(--prog);color:var(--prog)}
.modal-day-title{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--white);margin-bottom:6px}
.modal-day-sub{font-size:11px;color:var(--text-dim);margin-bottom:20px;line-height:1.7}
.exercise-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.exo-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.exo-icon{font-size:20px}
.exo-name{font-size:13px;color:var(--white);font-weight:400}
.exo-dur{font-size:9px;color:var(--text-dim);letter-spacing:1px}
.exo-desc{font-size:12px;color:var(--text-dim);line-height:1.8}
.exo-btn{width:100%;margin-top:10px;padding:10px;background:rgba(198,125,212,0.12);border:1px solid rgba(198,125,212,0.25);border-radius:8px;color:var(--prog);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
.exo-btn:hover{background:rgba(198,125,212,0.2)}
.exo-btn.done-btn{background:rgba(61,220,151,0.12);border-color:rgba(61,220,151,0.25);color:#3DDC97}

/* Journal */
.journal-section{margin-top:16px}
.journal-label{font-size:10px;letter-spacing:2px;color:var(--prog);text-transform:uppercase;margin-bottom:8px}
.journal-ta{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--white);font-family:'DM Mono',monospace;font-size:12px;resize:none;min-height:80px;line-height:1.6}
.journal-ta:focus{outline:none;border-color:rgba(198,125,212,0.35)}
.journal-ta::placeholder{color:var(--text-dim)}
.save-journal-btn{width:100%;margin-top:8px;padding:10px;background:linear-gradient(135deg,var(--prog),var(--prog2));border:none;border-radius:10px;color:#fff;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
.save-journal-btn:hover{opacity:0.9}
.complete-day-btn{width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,#3DDC97,#2BB87A);border:none;border-radius:12px;color:#0D0E14;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;font-weight:600}
.complete-day-btn:hover{opacity:0.9;transform:translateY(-1px)}

/* End of cycle */
.cycle-end{background:linear-gradient(135deg,rgba(198,125,212,0.15),rgba(125,107,232,0.1));border:1px solid rgba(198,125,212,0.2);border-radius:14px;padding:20px;text-align:center}
.cycle-end h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--white);margin-bottom:8px}
.cycle-end p{font-size:12px;color:var(--text-dim);line-height:1.8;margin-bottom:16px}
.cycle-btns{display:flex;flex-direction:column;gap:8px}
.cycle-btn{padding:12px;border-radius:10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-align:center}
.cycle-btn.primary{background:linear-gradient(135deg,var(--prog),var(--prog2));border:none;color:#fff}
.cycle-btn.secondary{background:var(--bg2);border:1px solid var(--border);color:var(--text-dim)}
.cycle-btn:hover{opacity:0.9;transform:translateY(-1px)}

/* Streak */
.streak-row{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.streak-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.3s}
.streak-dot.done{border-color:var(--prog);background:rgba(198,125,212,0.15)}
.streak-dot.today{border-color:var(--prog);background:rgba(198,125,212,0.1);box-shadow:0 0 8px rgba(198,125,212,0.3)}

/* BOTTOM NAV */
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;cursor:pointer;border:none;background:none;transition:all 0.25s;position:relative}
.nav-tab::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;border-radius:0 0 3px 3px;transition:width 0.3s}
.nav-tab.active::before{width:32px}
.nav-tab.t-mental::before{background:var(--mental)}
.nav-tab.t-motiv::before{background:var(--motiv)}
.nav-tab.t-sport::before{background:var(--sport)}
.nav-tab.t-prog::before{background:var(--prog)}
.tab-icon{font-size:20px}
.tab-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);transition:color 0.25s}
.nav-tab.active .tab-label{color:var(--white)}
.notif-dot{position:absolute;top:6px;right:calc(50% - 18px);width:6px;height:6px;border-radius:50%;background:var(--prog);display:none}
.notif-dot.show{display:block}

/* BREATHING OVERLAY */
.breath-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(13,14,20,0.96);align-items:center;justify-content:center;flex-direction:column;gap:18px}
.breath-overlay.show{display:flex}
.breath-ring{width:120px;height:120px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--accent);animation:breath 10s ease-in-out infinite;box-shadow:0 0 40px rgba(126,184,164,0.12)}
@keyframes breath{0%,100%{transform:scale(1)}40%{transform:scale(1.55);box-shadow:0 0 60px rgba(126,184,164,0.28)}60%{transform:scale(1.55)}80%{transform:scale(1)}}
.breath-label{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--white)}
.breath-sub{font-size:11px;color:var(--text-dim);text-align:center;max-width:220px;line-height:1.8}
.breath-close{font-size:10px;color:var(--text-dim);letter-spacing:2px;cursor:pointer;background:none;border:1px solid var(--border);padding:8px 18px;border-radius:20px;transition:all 0.2s}
.breath-close:hover{color:var(--white);border-color:var(--text-dim)}

/* INSTALL BANNER */
#installBanner{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid rgba(198,125,212,0.25);border-radius:12px;padding:10px 14px;z-index:140;display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,0.5);max-width:340px;width:90%;animation:slideUp 0.4s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid rgba(198,125,212,0.3);border-radius:10px;padding:10px 18px;font-size:11px;color:var(--white);z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="ambient"><div class="orb orb1"></div><div class="orb orb2"></div></div>

<div class="breath-overlay" id="breathOverlay">
  <div class="breath-ring" id="breathWord">Inspirez</div>
  <div class="breath-label">Respiration guidée</div>
  <div class="breath-sub">4 sec Inspirez · 4 sec Retenez · 4 sec Expirez · 2 sec Retenez</div>
  <button class="breath-close" onclick="stopBreath()">FERMER</button>
</div>

<div class="toast" id="toast"></div>

<!-- DAY MODAL -->
<div class="day-modal" id="dayModal">
  <div class="modal-header">
    <button class="modal-back" onclick="closeDayModal()">← RETOUR</button>

<script>
// ═══════════════════════════════════════════════════════
// MODULES CONFIG
// ═══════════════════════════════════════════════════════
const MODULES={
  mental:{name:'Mental',badge:'Coach Mental',icon:'🌿',accent:'#7EB8A4',accent2:'#A89FD8',
    chips:[{label:'🫁 Respiration',a:'respiration'},{label:'⚓ Ancrage',a:'ancrage'},{label:'🔄 Recadrage',a:'recadrage'},{label:'✨ Affirmation',a:'affirmation'},{label:'😔 Je me sens bas',a:'bas'},{label:'😰 Anxiété',a:'anxiete'}],

  motiv:{name:'Motivation',badge:'Coach Motivation',icon:'🔥',accent:'#E8A44A',accent2:'#E86A4A',
    chips:[{label:'🎯 Objectif',a:'objectif'},{label:'⏰ Procrastination',a:'procrastination'},{label:'💎 Routine',a:'routine'},{label:'🧠 État de flow',a:'flow'},{label:'📈 Visualisation',a:'visualisation'},{label:'💬 Discours intérieur',a:'discours'}],
    system:`Tu es Sereno, coach motivation IA percutant et bienveillant. Français uniquement. Freins, objectifs SMART, anti-procrastination (2-min rule, Pomodoro, WOOP), habitudes durables, flow, self-talk positif. Style direct, inspirant, métaphores puissantes. Max 110 mots sauf plan détaillé.`},
  sport:{name:'Sport',badge:'Coach Sport Mental',icon:'🏅',accent:'#5B9EE8',accent2:'#4ACFE8',
    chips:[{label:'🧘 Avant compét.',a:'precomp'},{label:'💪 Confiance',a:'confiance'},{label:'😤 Pression',a:'pression'},{label:'🏆 Routine perf.',a:'routine_sport'},{label:'😞 Après défaite',a:'defaite'},{label:'🎯 Visualisation',a:'visu_sport'}],
    system:`Tu es Sereno, coach préparation mentale sportive IA, expert bienveillant. Français uniquement. Prépa compétition, gestion pression/stress, confiance athlétique, visualisation mentale, routine de performance, gestion défaite/blessure, self-talk, cohésion équipe, mindfulness sportif. Tous sports. Style précis, concret, énergisant. Max 110 mots sauf protocole.`}
};
const QUICK={
  respiration:'Guide-moi dans un exercice de respiration pour me calmer maintenant.',
  ancrage:'Guide-moi dans un exercice d\'ancrage sensoriel 5-4-3-2-1.',
  recadrage:'Aide-moi à recadrer une pensée négative qui me bloque.',
  affirmation:'Donne-moi une affirmation positive puissante pour aujourd\'hui.',
  bas:'Je me sens vraiment bas en ce moment.',anxiete:'Je ressens beaucoup d\'anxiété, aide-moi.',
  objectif:'Aide-moi à définir un objectif clair et motivant.',procrastination:'Je procrastine énormément, aide-moi à passer à l\'action.',
  routine:'Aide-moi à construire une routine de discipline quotidienne.',flow:'Comment entrer dans un état de flow ?',
  visualisation:'Guide-moi dans une visualisation de succès.',discours:'Transforme mon discours intérieur négatif.',
  precomp:'J\'ai une compétition bientôt, prépare ma tête.',confiance:'J\'ai perdu confiance en moi en tant qu\'athlète.',
  pression:'Je gère mal la pression en compétition.',routine_sport:'Crée-moi une routine mentale avant mes matchs.',
  defaite:'Je viens de perdre, aide-moi à me relever.',visu_sport:'Guide-moi dans une visualisation sportive complète.'
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let currentTab='mental';
let histories={mental:[],motiv:[],sport:[]};
let isRecording=false,isSpeaking=false,voiceEnabled=true;
let recognition=null,vizInterval=null,breathInterval=null,deferredPrompt=null;

// Programme state (persisted in localStorage)
let prog=JSON.parse(localStorage.getItem('sereno_prog')||'null');

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded',()=>{
  initSR();
  // Init chat tabs
  Object.keys(MODULES).forEach(mod=>{
    const M=MODULES[mod];
    const bar=document.getElementById('chips-'+mod);
    if(bar)bar.innerHTML=M.chips.map(c=>`<span class="chip" onclick="quickAction('${c.a}')">${c.label}</span>`).join('');
    if(histories[mod].length===0)setTimeout(()=>addCoachMsg(getIntro(mod),mod,false),300);
  });
  renderProgView();
  if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
  if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallBanner();});
  checkDailyReminder();
});

function getIntro(mod){
  const intros={
    mental:'Bonjour, je suis Sereno, votre coach mental. Je suis là pour vous accompagner dans la gestion du stress, des émotions et des pensées difficiles.\n\nComment vous sentez-vous en ce moment ?',
    motiv:'Bienvenue ! Je suis votre coach Motivation. Ensemble on va briser la procrastination, clarifier vos objectifs et construire une discipline qui dure.\n\nQu\'est-ce qui vous freine en ce moment ?',
    sport:'Bienvenue athlète. Je suis votre coach en préparation mentale sportive — pour tous les sports, tous les niveaux.\n\nQuelle est votre discipline, et quel défi mental souhaitez-vous travailler ?'
  };
  return intros[mod];
}

// ═══════════════════════════════════════════════════════
// TAB SWITCHING
// ═══════════════════════════════════════════════════════
function switchTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  const M=MODULES[tab];
  if(M){
    document.documentElement.style.setProperty('--accent',M.accent);
    document.documentElement.style.setProperty('--accent2',M.accent2);
    document.getElementById('logoModule').textContent=M.name;
    document.getElementById('logoModule').style.color=M.accent;
    document.getElementById('logoIcon').textContent=M.icon;
    const badge=document.getElementById('moduleBadge');
    badge.textContent=M.badge;badge.style.color=M.accent;badge.style.borderColor=M.accent+'40';badge.style.background=M.accent+'12';
    const sd=document.getElementById('statusDot');sd.style.background=M.accent;sd.style.boxShadow='0 0 7px '+M.accent;
  }else{
    // Programme tab
    document.documentElement.style.setProperty('--accent','#C67DD4');
    document.documentElement.style.setProperty('--accent2','#7D6BE8');
    document.getElementById('logoModule').textContent='Programme';
    document.getElementById('logoModule').style.color='#C67DD4';
    document.getElementById('logoIcon').textContent='📋';
    const badge=document.getElementById('moduleBadge');
    badge.textContent='Programme Perso';badge.style.color='#C67DD4';badge.style.borderColor='#C67DD440';badge.style.background='#C67DD412';
    const sd=document.getElementById('statusDot');sd.style.background='#C67DD4';sd.style.boxShadow='0 0 7px #C67DD4';
    document.getElementById('notifDot').classList.remove('show');
    renderProgView();
  }
}

// ═══════════════════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════════════════
function getActiveInputs(){
  const map={mental:{ta:'textInput',btn:'sendBtn'},motiv:{ta:'textInput2',btn:'sendBtn2'},sport:{ta:'textInput3',btn:'sendBtn3'}};
  return map[currentTab]||map.mental;
}
function sendText(){
  const {ta}=getActiveInputs();
  const input=document.getElementById(ta);
  if(!input)return;
  const msg=input.value.trim();if(!msg)return;
  input.value='';autoResize(input);
  histories[currentTab].push({role:'user',content:msg});
  addUserDOM(msg,currentTab);
  callAPI(currentTab);
}
function quickAction(action){
  if(action==='respiration'){startBreath();return;}
  const p=QUICK[action];if(!p)return;
  histories[currentTab].push({role:'user',content:p});
  addUserDOM(p,currentTab);callAPI(currentTab);
}
async function callAPI(mod){
  const M=MODULES[mod];
  showTyping(true,mod);setStatus('thinking','◌ Réflexion…');
  try{
    const res=await fetch('/.netlify/functions/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:800,system:M.system,messages:histories[mod].map(h=>({role:h.role,content:h.content}))})
    });
    const data=await res.json();
    const reply=data.content?.map(b=>b.text||'').join('')||'Je suis momentanément indisponible. Respirez. 🌿';
    showTyping(false,mod);setStatus('','Parler');
    addCoachMsg(reply,mod,true);
  }catch(e){showTyping(false,mod);setStatus('','Parler');addCoachMsg('Souci de connexion. Réessayez.',mod,false);}
}

function addCoachMsg(text,mod,autoSpeak=true){
  histories[mod].push({role:'assistant',content:text});
  addCoachDOM(text,mod);
  if(autoSpeak&&voiceEnabled&&currentTab===mod)setTimeout(()=>speakText(text),200);
}
function addCoachDOM(text,mod){
  const M=MODULES[mod];
  const msgs=document.getElementById('msgs-'+mod);
  const typing=document.getElementById('typing-'+mod);
  const d=document.createElement('div');d.className='msg coach';
  d.innerHTML=`<div class="msg-av" style="background:linear-gradient(135deg,${M.accent},${M.accent2})">${M.icon}</div>
    <div class="msg-body"><div class="bubble">${text.replace(/\n/g,'<br>')}</div>
    <div class="msg-meta"><button class="speak-btn" data-text="${text.replace(/"/g,'&quot;')}" onclick="speakText(this.dataset.text)">🔊</button>
    <div class="msg-time">${now()}</div></div></div>`;
  msgs.insertBefore(d,typing);msgs.scrollTop=msgs.scrollHeight;
}
function addUserDOM(text,mod){
  const msgs=document.getElementById('msgs-'+mod);
  const typing=document.getElementById('typing-'+mod);
  const d=document.createElement('div');d.className='msg user';
  d.innerHTML=`<div class="msg-body"><div class="bubble">${text.replace(/\n/g,'<br>')}</div>
    <div class="msg-meta"><div class="msg-time">${now()}</div></div></div>
    <div class="msg-av">Vous</div>`;
  msgs.insertBefore(d,typing);msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(show,mod){
  document.getElementById('typing-'+mod).classList.toggle('show',show);
  if(show)document.getElementById('msgs-'+mod).scrollTop=9999;
}

// ═══════════════════════════════════════════════════════
// PROGRAMME VIEW
// ═══════════════════════════════════════════════════════
function renderProgView(){
  const container=document.getElementById('progScroll');
  if(!prog){renderWizard(container);return;}
  if(prog.completed&&!prog.continued){renderCycleEnd(container);return;}
  renderActiveProg(container);
}

// ── WIZARD ──
let wizData={module:'mental',goal:'',duration:7,context:''};
function renderWizard(container){
  container.innerHTML=`<div class="wizard">
    <div class="wizard-title">Créer votre programme personnalisé</div>
    <div class="wizard-sub">L'IA va générer un programme sur-mesure basé sur votre profil et vos objectifs. Répondez à quelques questions.</div>
    <div>
      <div class="wiz-label">Quel domaine ?</div>
      <div class="wiz-options">
        <div class="wiz-opt sel" onclick="selWiz(this,'module','mental')">🌿 Bien-être mental</div>
        <div class="wiz-opt" onclick="selWiz(this,'module','motiv')">🔥 Motivation & discipline</div>
        <div class="wiz-opt" onclick="selWiz(this,'module','sport')">🏅 Performance sportive</div>
        <div class="wiz-opt" onclick="selWiz(this,'module','mix')">✨ Programme mixte</div>
      </div>
    </div>
    <div>
      <div class="wiz-label">Durée souhaitée</div>
      <div class="wiz-options">
        <div class="wiz-opt sel" onclick="selWiz(this,'duration',7)">7 jours</div>
        <div class="wiz-opt" onclick="selWiz(this,'duration',14)">14 jours</div>
        <div class="wiz-opt" onclick="selWiz(this,'duration',21)">21 jours</div>
        <div class="wiz-opt" onclick="selWiz(this,'duration',30)">30 jours</div>
      </div>
    </div>
    <div>
      <div class="wiz-label">Votre objectif principal</div>
      <textarea class="wiz-input" id="wizGoal" placeholder="Ex : Réduire mon anxiété quotidienne et mieux dormir…" oninput="wizData.goal=this.value"></textarea>
    </div>
    <div>
      <div class="wiz-label">Contexte (optionnel)</div>
      <textarea class="wiz-input" id="wizContext" placeholder="Ex : Je suis sportif amateur, je cours 3x/semaine, j'ai un marathon dans 2 mois…" oninput="wizData.context=this.value" style="min-height:55px"></textarea>
    </div>
    <div>
      <div class="wiz-label">Niveau actuel</div>
      <div class="wiz-options">
        <div class="wiz-opt sel" onclick="selWiz(this,'level','debutant')">🟢 Débutant</div>
        <div class="wiz-opt" onclick="selWiz(this,'level','intermediaire')">🟡 Intermédiaire</div>
        <div class="wiz-opt" onclick="selWiz(this,'level','avance')">🔴 Avancé</div>
      </div>
    </div>
    <button class="wiz-btn" id="wizBtn" onclick="generateProg()">✨ GÉNÉRER MON PROGRAMME</button>
    <div style="font-size:10px;color:var(--text-dim);text-align:center;line-height:1.8">Ou choisir un programme prédéfini ↓</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[
        {icon:'🧘',title:'Anti-stress 7j',mod:'mental',dur:7,goal:'Réduire le stress et l\'anxiété quotidienne'},
        {icon:'🚀',title:'Boost motivation 21j',mod:'motiv',dur:21,goal:'Construire une discipline solide et vaincre la procrastination'},
        {icon:'🏆',title:'Mental sportif 14j',mod:'sport',dur:14,goal:'Optimiser la préparation mentale avant les compétitions'},
        {icon:'💪',title:'Confiance 30j',mod:'mix',dur:30,goal:'Renforcer l\'estime de soi et la confiance dans tous les domaines'},
      ].map(p=>`<div class="day-card" style="margin:0" onclick="loadPreset(${JSON.stringify(p)})">
        <div style="font-size:20px;margin-bottom:6px">${p.icon}</div>
        <div class="day-title" style="font-size:15px">${p.title}</div>
        <div class="day-desc">${p.dur} jours · ${p.mod==='mix'?'Mixte':MODULES[p.mod]?.name||p.mod}</div>
      </div>`).join('')}
    </div>
  </div>`;
  wizData={module:'mental',goal:'',duration:7,context:'',level:'debutant'};
}

function selWiz(el,key,val){
  el.closest('.wiz-options').querySelectorAll('.wiz-opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');wizData[key]=val;
}
function loadPreset(p){
  wizData={module:p.mod,goal:p.goal,duration:p.dur,context:'',level:'intermediaire'};
  generateProg();
}

async function generateProg(){
  const btn=document.getElementById('wizBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Génération...';}
  try{
    const modLabel={sport:'sport mental',boxe:'boxe mental',mental:'bien-être mental',motiv:'motivation',mix:'mixte'}[wizData.module]||'sport mental';
    const res=await fetch('/.netlify/functions/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:3000,
        system:'Expert coaching mental. JSON valide complet sur une seule ligne. Utilise uniquement emojis simples: 🥊 🧘 💪 🎯 🔥 ⚡ ✍️ 🏆. Pas de ZWJ emojis.',
        messages:[{role:'user',content:`Programme coaching mental 3 jours. Domaine: ${modLabel}. Objectif: ${wizData.goal||'performance mentale'}. Niveau: ${wizData.level||'intermediaire'}. JSON: {"name":"string","tagline":"string","days":[{"day":1,"theme":"string","description":"string","exercises":[{"icon":"🥊","name":"string","duration":"5 min","description":"string"},{"icon":"🧘","name":"string","duration":"5 min","description":"string"}],"journalPrompt":"string"},{"day":2,"theme":"string","description":"string","exercises":[{"icon":"💪","name":"string","duration":"5 min","description":"string"},{"icon":"🎯","name":"string","duration":"5 min","description":"string"}],"journalPrompt":"string"},{"day":3,"theme":"string","description":"string","exercises":[{"icon":"🔥","name":"string","duration":"5 min","description":"string"},{"icon":"⚡","name":"string","duration":"5 min","description":"string"}],"journalPrompt":"string"}]}`}]
      })
    });
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||'').join('')||'{}';
    const i1=raw.indexOf('{');const i2=raw.lastIndexOf('}');
    if(i1===-1||i2===-1)throw new Error('Pas de JSON');
    const jsonStr=raw.substring(i1,i2+1).replace(/️/g,'').replace(/‍/g,'');
    const generated=JSON.parse(jsonStr);
    if(!generated.days||generated.days.length===0)throw new Error('Vide');
    prog={...generated,module:wizData.module,duration:wizData.duration,startDate:new Date().toISOString(),currentDay:1,completed:false,continued:false,completedDays:[],journals:{},goal:wizData.goal,level:wizData.level};
    saveAndRender();
  }catch(e){
    console.error('generateProg:',e.message);
    showToast('Erreur: '+e.message.substring(0,50));
    if(btn){btn.disabled=false;btn.textContent='✨ GÉNÉRER';}
  }
}

function saveAndRender(){
  localStorage.setItem('sereno_prog',JSON.stringify(prog));
  renderProgView();
}

// ── ACTIVE PROGRAMME ──
function renderActiveProg(container){
  if(!prog||!prog.days)return;
  const total=prog.days.length;
  const done=prog.completedDays.length;
  const pct=Math.round((done/total)*100);
  const today=new Date();
  const start=new Date(prog.startDate);
  const daysSinceStart=Math.floor((today-start)/(1000*60*60*24));
  const currentDay=Math.min(daysSinceStart+1,total);

  // Streak dots (last 7 days)
  const streakDays=prog.days.slice(Math.max(0,currentDay-7),currentDay);
  const streakHTML=streakDays.map((d,i)=>{
    const dayNum=Math.max(1,currentDay-7)+i+1;
    const isDone=prog.completedDays.includes(dayNum);
    const isToday=dayNum===currentDay;
    return `<div class="streak-dot ${isDone?'done':isToday?'today':''}">${isDone?'✓':d.day}</div>`;
  }).join('');

  container.innerHTML=`
    <div class="prog-header-card">
      <div class="prog-name">${prog.name}</div>
      <div class="prog-meta">${prog.tagline||''} · Jour ${currentDay}/${total}</div>
      <div class="streak-row">${streakHTML}</div>
      <div class="prog-bar-track"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
      <div class="prog-pct">${pct}% COMPLÉTÉ · ${done}/${total} JOURS</div>
      <div class="prog-actions">
        <div class="prog-action-btn primary" onclick="openDay(${currentDay})">▶ JOUR ${currentDay}</div>
        <div class="prog-action-btn" onclick="showJournalHistory()">📖 Journal</div>
        <div class="prog-action-btn" onclick="resetProg()">↺ Reset</div>
      </div>
    </div>
    <div style="font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px">TOUS LES JOURS</div>
    ${prog.days.map(d=>{
      const isDone=prog.completedDays.includes(d.day);
      const isToday=d.day===currentDay;
      const isLocked=d.day>currentDay;
      return `<div class="day-card ${isDone?'done':isToday?'today':isLocked?'locked':''}" onclick="${isLocked?'showToast(\'Ce jour n\'est pas encore disponible\')':'openDay('+d.day+')'}">
        <div class="day-top">
          <div class="day-num">JOUR ${d.day}</div>
          <div class="day-badge ${isDone?'done':isToday?'today':'locked'}">${isDone?'✓ COMPLÉTÉ':isToday?'AUJOURD\'HUI':'🔒'}</div>
        </div>
        <div class="day-title">${d.theme}</div>
        <div class="day-desc">${d.description}</div>
        <div class="day-exercises">${(d.exercises||[]).map(e=>`<span class="exo-tag">${e.icon} ${e.name}</span>`).join('')}</div>
      </div>`;
    }).join('')}`;
}

function renderCycleEnd(container){
  const total=prog.days.length;
  const done=prog.completedDays.length;
  const nextDurations=[21,30,60].filter(d=>d>total);
  container.innerHTML=`<div class="cycle-end">
    <div style="font-size:40px;margin-bottom:10px">🎉</div>
    <h3>Programme terminé !</h3>
    <p>Félicitations ! Vous avez complété <strong>${done}/${total} jours</strong> de votre programme <em>${prog.name}</em>.<br><br>
    Vous avez construit de nouvelles habitudes. La vraie question est : quelle est la prochaine étape ?</p>
    <div class="cycle-btns">
      ${nextDurations.map(d=>`<div class="cycle-btn primary" onclick="continueWith(${d})">🚀 Continuer — Programme ${d} jours (adapté)</div>`).join('')}
      <div class="cycle-btn secondary" onclick="continueWith(total,'same')">🔄 Recommencer ce programme</div>
      <div class="cycle-btn secondary" onclick="newProg()">✨ Créer un nouveau programme</div>
    </div>
  </div>
  <div style="margin-top:16px;font-size:10px;color:var(--text-dim);letter-spacing:1px;text-align:center">Votre journal de bord est conservé</div>`;
}

// ── DAY MODAL ──
function openDay(dayNum){
  const d=prog.days.find(x=>x.day===dayNum);if(!d)return;
  const isDone=prog.completedDays.includes(dayNum);
  const journal=prog.journals[dayNum]||'';
  document.getElementById('modalDayNum').textContent=`JOUR ${dayNum}`;
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-day-title">${d.theme}</div>
    <div class="modal-day-sub">${d.description}</div>
    ${(d.exercises||[]).map((e,i)=>`
      <div class="exercise-card">
        <div class="exo-header">
          <div class="exo-icon">${e.icon}</div>
          <div><div class="exo-name">${e.name}</div><div class="exo-dur">⏱ ${e.duration}</div></div>
        </div>
        <div class="exo-desc">${e.description}</div>
        <button class="exo-btn" onclick="startExercise(${i},${dayNum})" id="exo-${i}">▶ COMMENCER</button>
      </div>`).join('')}
    <div class="journal-section">
      <div class="journal-label">📖 Journal du jour</div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;font-style:italic">${d.journalPrompt||'Comment s\'est passé votre journée ?'}</div>
      <textarea class="journal-ta" id="journalInput" placeholder="Écrivez vos réflexions…">${journal}</textarea>
      <button class="save-journal-btn" onclick="saveJournal(${dayNum})">💾 SAUVEGARDER LE JOURNAL</button>
    </div>
    ${!isDone?`<button class="complete-day-btn" onclick="completeDay(${dayNum})">✅ MARQUER LE JOUR COMME COMPLÉTÉ</button>`
    :`<div style="text-align:center;padding:14px;font-size:12px;color:#3DDC97;letter-spacing:1px">✓ Jour complété !</div>`}`;
  document.getElementById('dayModal').classList.add('show');
}

function closeDayModal(){document.getElementById('dayModal').classList.remove('show');}

function startExercise(i,dayNum){
  const d=prog.days.find(x=>x.day===dayNum);
  const e=d.exercises[i];
  const btn=document.getElementById('exo-'+i);
  btn.classList.add('done-btn');btn.textContent='✓ En cours…';
  // Ask AI for live guidance
  const mod=prog.module==='mix'?'mental':prog.module;
  const M=MODULES[mod]||MODULES.mental;
  showToast(`${e.icon} ${e.name} — ${e.duration}`);
  if(e.name.toLowerCase().includes('respir')){startBreath();}
}

function saveJournal(dayNum){
  const val=document.getElementById('journalInput')?.value||'';
  prog.journals[dayNum]=val;
  saveAndRender();
  showToast('✓ Journal sauvegardé');
}

function completeDay(dayNum){
  if(!prog.completedDays.includes(dayNum))prog.completedDays.push(dayNum);
  if(prog.completedDays.length>=prog.days.length)prog.completed=true;
  saveJournal(dayNum);
  closeDayModal();
  saveAndRender();
  showToast('🎉 Jour '+dayNum+' complété !');
  document.getElementById('notifDot').classList.add('show');
  if(prog.completed)setTimeout(()=>renderProgView(),300);
}

function continueWith(newDur,mode){
  const oldProg=prog;
  prog={...prog,completed:false,continued:true,startDate:new Date().toISOString(),completedDays:[],journals:{}};
  if(mode==='same'){prog.currentDay=1;saveAndRender();return;}
  // Generate new adapted programme
  wizData={module:oldProg.module,goal:oldProg.goal+' — Continuation avancée après '+oldProg.duration+' jours',duration:newDur,context:'Programme précédent : '+oldProg.name+'. L\'utilisateur a complété '+oldProg.completedDays.length+' jours.',level:'avance'};
  const container=document.getElementById('progScroll');
  container.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text-dim)"><div style="font-size:30px;margin-bottom:12px">⏳</div><div>Génération de votre programme avancé ${newDur} jours…</div></div>`;
  generateProg();
}

function newProg(){prog=null;localStorage.removeItem('sereno_prog');renderProgView();}
function resetProg(){if(confirm('Réinitialiser le programme ?')){newProg();}}

function showJournalHistory(){
  const entries=Object.entries(prog.journals||{}).filter(([,v])=>v.trim());
  if(!entries.length){showToast('Aucune entrée de journal encore');return;}
  const container=document.getElementById('progScroll');
  container.innerHTML=`<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--white)">📖 Journal de bord</div>
      <button onclick="renderProgView()" style="background:none;border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:10px;letter-spacing:2px">RETOUR</button>
    </div>
    ${entries.map(([day,text])=>`
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px">
        <div style="font-size:10px;color:var(--prog);letter-spacing:2px;margin-bottom:8px">JOUR ${day} — ${prog.days[day-1]?.theme||''}</div>
        <div style="font-size:13px;color:var(--text);line-height:1.8">${text.replace(/\n/g,'<br>')}</div>
      </div>`).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// DAILY REMINDER
// ═══════════════════════════════════════════════════════
function checkDailyReminder(){
  if(!prog||prog.completed)return;
  const lastCheck=localStorage.getItem('sereno_lastCheck');
  const today=new Date().toDateString();
  if(lastCheck===today)return;
  localStorage.setItem('sereno_lastCheck',today);
  const start=new Date(prog.startDate);
  const dayNum=Math.floor((new Date()-start)/(1000*60*60*24))+1;
  if(dayNum<=prog.days.length&&!prog.completedDays.includes(dayNum)){
    setTimeout(()=>{
      document.getElementById('notifDot').classList.add('show');
      showToast(`📋 Jour ${dayNum} de votre programme vous attend !`);
    },2000);
  }
}

// ═══════════════════════════════════════════════════════
// VOICE
// ═══════════════════════════════════════════════════════
function initSR(){
  if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window))return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='fr-FR';recognition.continuous=false;recognition.interimResults=true;
  recognition.onresult=e=>{
    const text=Array.from(e.results).map(r=>r[0].transcript).join('');
    const {ta}=getActiveInputs();
    const input=document.getElementById(ta);if(input){input.value=text;autoResize(input);}
    if(e.results[e.results.length-1].isFinal){stopRecording();if(text.trim())sendText();}
  };
  recognition.onerror=()=>stopRecording();
  recognition.onend=()=>{if(isRecording)stopRecording();};
}
function toggleMic(){if(isSpeaking){stopSpeaking();return;}if(isRecording){stopRecording();return;}startRecording();}
function startRecording(){
  if(!recognition){alert('Utilisez Chrome sur Android.');return;}
  stopSpeaking();isRecording=true;try{recognition.start();}catch(e){}
  ['micBtn','micBtn2','micBtn3'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.add('recording');b.textContent='⏹';}});
  setStatus('listening','● Écoute…');startViz();
}
function stopRecording(){
  isRecording=false;try{recognition.stop();}catch(e){}
  ['micBtn','micBtn2','micBtn3'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.remove('recording');b.textContent='🎤';}});
  setStatus('','Parler');stopViz();
}
function speakText(text){
  if(!voiceEnabled||!('speechSynthesis'in window))return;stopSpeaking();
  const clean=text.replace(/[*_~`#]/g,'').substring(0,450);
  const utt=new SpeechSynthesisUtterance(clean);utt.lang='fr-FR';utt.rate=0.87;utt.pitch=1.0;
  const voices=speechSynthesis.getVoices();
  const fr=voices.find(v=>v.lang.startsWith('fr')&&/female|femme/i.test(v.name))||voices.find(v=>v.lang.startsWith('fr'))||voices[0];
  if(fr)utt.voice=fr;
  utt.onstart=()=>{isSpeaking=true;['micBtn','micBtn2','micBtn3'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.add('speaking');b.textContent='⏸';}});setStatus('speaking','◈ Parole…');startViz('accent2');};
  utt.onend=utt.onerror=()=>{isSpeaking=false;['micBtn','micBtn2','micBtn3'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.remove('speaking');b.textContent='🎤';}});setStatus('','Parler');stopViz();};
  speechSynthesis.speak(utt);
}
function stopSpeaking(){if('speechSynthesis'in window)speechSynthesis.cancel();isSpeaking=false;['micBtn','micBtn2','micBtn3'].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.remove('speaking');b.textContent='🎤';}});stopViz();}
function toggleVoice(el){el.classList.toggle('on');voiceEnabled=el.classList.contains('on');if(!voiceEnabled)stopSpeaking();}

// ═══════════════════════════════════════════════════════
// VISUALIZER / BREATH / HELPERS
// ═══════════════════════════════════════════════════════
function startViz(colorVar='accent'){
  const viz=document.getElementById('visualizer');if(!viz)return;viz.classList.add('active');
  viz.querySelectorAll('.vbar').forEach(b=>b.style.background=`var(--${colorVar})`);
  clearInterval(vizInterval);vizInterval=setInterval(()=>{viz.querySelectorAll('.vbar').forEach(b=>b.style.height=(3+Math.random()*28)+'px');},100);
}
function stopViz(){clearInterval(vizInterval);const viz=document.getElementById('visualizer');if(!viz)return;viz.classList.remove('active');viz.querySelectorAll('.vbar').forEach(b=>b.style.height='3px');}
function startBreath(){
  document.getElementById('breathOverlay').classList.add('show');
  const el=document.getElementById('breathWord');
  const phases=['Inspirez','Retenez','Expirez','Retenez'],durs=[4000,4000,4000,2000];
  let i=0;el.textContent=phases[0];clearInterval(breathInterval);let elapsed=0;
  breathInterval=setInterval(()=>{elapsed+=100;if(elapsed>=durs[i]){elapsed=0;i=(i+1)%phases.length;el.textContent=phases[i];}},100);
}
function stopBreath(){clearInterval(breathInterval);document.getElementById('breathOverlay').classList.remove('show');}
function showInstallBanner(){
  if(document.getElementById('installBanner'))return;
  const b=document.createElement('div');b.id='installBanner';
  b.innerHTML=`<span>🌿</span><span style="flex:1">Installer Sereno sur votre écran d'accueil ?</span>
    <button onclick="installApp()" style="background:var(--accent);color:var(--bg);border:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px">INSTALLER</button>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:18px;line-height:1">×</button>`;
  document.body.appendChild(b);
}
async function installApp(){
  if(!deferredPrompt)return;deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBanner')?.remove();
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function setStatus(cls,text){
  ['micStatus','micStatus2','micStatus3'].forEach(id=>{const el=document.getElementById(id);if(el){el.className='mic-status'+(cls?' '+cls:'');el.textContent=text;}});
}
function now(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,88)+'px';}
</script>
